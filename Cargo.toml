[workspace]
resolver = "2"
members = ["runtime"]

[workspace.package]
version = "0.1.27"
edition = "2021"
# The oldest Rust this builds on. A separate statement from the toolchain
# pinned in rust-toolchain.toml: that one says what CI and contributors build
# with, this one says what cargo will refuse. Without it, too old a compiler
# fails as a type error somewhere in a dependency instead of as a sentence.
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/Vantail/vantail"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Lints for every crate in the workspace; a member opts in with
# `[lints] workspace = true`. Each one is here to keep the code easy to read
# and review, and docs/rust-guidelines.md says why. A lint is added once the
# code already passes it, so this table only ever gets stricter.
[workspace.lints.rust]
# Each unsafe operation inside an `unsafe fn` still needs its own block, and
# so its own `Safety` comment, rather than the whole body being unsafe.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# `unsafe` stays - the window chrome, menus, printing and permission prompts
# are calls into the OS - but every block says why it is sound.
undocumented_unsafe_blocks = "deny"
# A panic should be a decision someone wrote down, not a default. Tests are
# exempt; see clippy.toml.
unwrap_used = "deny"
# Short functions, shallow nesting, few arguments; the limits are in
# clippy.toml. A function that is long for a good reason - one template, say -
# says so in an allow beside it.
too_many_lines = "deny"
excessive_nesting = "deny"
too_many_arguments = "deny"
