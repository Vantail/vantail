name: Release

# Two channels, one workflow, on purpose. npm allows a package exactly one
# trusted publisher, bound to an exact workflow filename, so a second file
# publishing dev builds would need a token to go with it. Keeping both here
# means the whole project publishes without a credential anywhere.
#
#   a tag       -> that version, tagged `latest`
#   a push      -> a prerelease of the next patch, tagged `dev`
#
#   npm install @vantail/cli        # the last release
#   npm install @vantail/cli@dev    # main
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything but publish nothing
        type: boolean
        default: true
      build_runtimes:
        description: Force the five native builds, even if the Rust has not changed
        type: boolean
        default: false

# A newer push to main makes an in-flight dev build pointless. A release is
# never cancelled: it has native builds behind it and a tag that will not come
# round again.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The five native builds are most of what a release costs - a macOS runner
  # at ten times the Linux rate. They are only needed when the Rust has
  # actually changed, so a release that only touches TypeScript reuses the
  # binaries already published and skips them.
  plan:
    name: Plan
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-22.04' }}
    outputs:
      channel: ${{ steps.decide.outputs.channel }}
      ready: ${{ steps.decide.outputs.ready }}
      build_runtimes: ${{ steps.decide.outputs.build_runtimes }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The last release tag is what a dev build takes its binaries from,
          # and a shallow clone has no tags.
          fetch-depth: 0

      - id: decide
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # A hand-started run is a release rehearsal, not a dev build: it is
          # how the native builds are exercised without a tag, and it defaults
          # to publishing nothing. Treating it as a dev build would skip it
          # entirely, since a dev build never builds runtimes.
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL=release
          else
            CHANNEL=dev
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

          # ---------------------------------------------------------------
          # A dev build ships the TypeScript against the last release's
          # binaries. Every way that could be wrong is a reason to skip, not
          # to fail: none of them is a fault in the commit that triggered it,
          # and a red cross on every push is how people learn to ignore them.
          # ---------------------------------------------------------------
          if [ "$CHANNEL" = "dev" ]; then
            echo "build_runtimes=false" >> "$GITHUB_OUTPUT"

            TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            if [ -z "$TAG" ]; then
              echo "::warning::No release tag yet, so there are no native runtimes for a dev build to point at. Dev builds start after the first release."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if ! git diff --quiet "$TAG..HEAD" -- runtime/src Cargo.toml Cargo.lock; then
              echo "::warning::The runtime has changed since $TAG. A dev build would pair new TypeScript with that release's binaries, so it is skipped. Cut a release to pick the change up."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Nothing shippable in this push means nothing to publish. A
            # force push or a new branch reports no useful `before`, so those
            # go ahead rather than guess.
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
               && git diff --quiet "$BEFORE..HEAD" -- packages runtime/src Cargo.toml Cargo.lock; then
              echo "Nothing that ships changed in this push."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Dev build against $TAG."
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---------------------------------------------------------------
          # A release. The five native builds are most of what it costs, so
          # they run only when the Rust has actually moved.
          # ---------------------------------------------------------------
          echo "ready=true" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.build_runtimes }}" = "true" ]; then
            echo "Asked for."
            echo "build_runtimes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The tag before this one, so a tag push compares against the last
          # release rather than against itself.
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)

          if [ -z "$PREV" ]; then
            echo "No earlier release, so there are no binaries to reuse."
            echo "build_runtimes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$PREV..HEAD" -- runtime/src Cargo.toml Cargo.lock; then
            echo "::notice::The runtime has not changed since $PREV. Reusing its binaries and skipping the native builds."
            echo "build_runtimes=false" >> "$GITHUB_OUTPUT"
          else
            echo "The runtime has changed since $PREV."
            echo "build_runtimes=true" >> "$GITHUB_OUTPUT"
          fi

  # One job per published target. A native runner for each rather than
  # cross-compilation, because the runtime links against the platform's
  # webview, tray and HID libraries and cross-compiling those is a source of
  # problems nobody needs on a release day.
  runtime:
    name: ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.build_runtimes == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # The runtime has to at least start and answer, or the binary is not
      # worth publishing.
      - name: Smoke test the binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/vantail-runtime"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          "$BIN" --version
          "$BIN" --help > /dev/null

      - name: Collect
        shell: bash
        run: |
          mkdir -p "dist-runtime/${{ matrix.target }}"
          cp target/${{ matrix.target }}/release/vantail-runtime* \
             "dist-runtime/${{ matrix.target }}/"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: dist-runtime/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

      # WiX only exists on Windows and only as a dotnet tool, so the .msi is
      # the one installer that needs something installed first.
      - name: Install WiX
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix

  publish:
    name: Publish
    needs: [plan, runtime]
    # `runtime` is skipped when the Rust has not moved, and a skipped
    # dependency would otherwise skip this too. `ready` is what turns a push
    # with nothing to ship into a no-op instead of a failure.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.ready == 'true' && needs.runtime.result != 'failure' && needs.runtime.result != 'cancelled'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-22.04' }}
    permissions:
      contents: write
      # There is no npm token. The publish authenticates with a short-lived
      # OIDC token minted from this workflow, and this is what allows minting
      # it. It also signs the provenance attestation. Without it the release
      # fails at the last step, after the five native builds have already run.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm 11.5.1 or newer, and Node 22 still ships
      # npm 10. pnpm handles the install; this is the npm that publish.mjs
      # shells out to.
      #
      # Checked rather than assumed: too old an npm does not say so, it simply
      # never attempts the OIDC exchange and asks for a token that does not
      # exist. That surfaces as ENEEDAUTH at the last step, after the native
      # builds have already run.
      - name: Upgrade npm to one that can publish with OIDC
        run: |
          npm install -g npm@latest
          version=$(npm --version)
          echo "npm $version"
          if [ "$(printf '11.5.1\n%s\n' "$version" | sort -V | head -1)" != "11.5.1" ]; then
            echo "npm $version is too old to publish with OIDC; 11.5.1 is the minimum." >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # Checked before the dev bump rewrites them, so this is still checking
      # what the commit actually says.
      - run: node scripts/version.mjs --check

      # A prerelease of the next patch, so it sorts above the last release and
      # below the next one. The run number keeps them ordered and unique.
      # `publish.mjs` reads the version back and tags a prerelease `dev` on its
      # own, so `latest` is never moved by a push to main.
      - name: Set the prerelease version
        if: needs.plan.outputs.channel == 'dev'
        run: node scripts/version.mjs dev "${{ github.run_number }}"

      - run: pnpm build
      - run: pnpm run test:packages

      # Every artifact lands in dist-runtime/<target>/, which is the layout
      # the packaging script expects. Nothing to download when the native
      # builds were skipped.
      - uses: actions/download-artifact@v7
        if: needs.plan.outputs.build_runtimes == 'true'
        with:
          path: dist-runtime

      - name: Confirm the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION" >&2
            exit 1
          fi

      - name: Build platform packages
        if: needs.plan.outputs.build_runtimes == 'true'
        run: node scripts/build-platform-packages.mjs --binaries dist-runtime --out dist-packages --all

      # `publish.mjs` passes this file to every `npm publish` as --userconfig,
      # which is what carries the registry into each package directory. npm
      # reads a project `.npmrc` from the working directory only, and every
      # publish runs with `cwd` set to a package.
      #
      # It holds no credential. Trusted publishing exchanges the workflow's
      # OIDC token for a short-lived one at publish time, so there is nothing
      # here to leak and nothing to rotate. An `_authToken` line would take
      # precedence over that exchange, so there must not be one.
      #
      # The scope is public on npmjs, which is the only registry where
      # `npm create @vantail` resolves without the user configuring anything.
      - name: Point the scope at npmjs
        run: echo "@vantail:registry=https://registry.npmjs.org" > .npmrc

      # Without new binaries, the release publishes the TypeScript alone and
      # points at the runtime the last release published. That version has to
      # exist, or `@vantail/runtime` would name packages nobody can install.
      - name: Find the runtime to point at
        id: runtime
        if: needs.plan.outputs.build_runtimes != 'true'
        run: |
          VERSION=$(node scripts/last-runtime-version.mjs --userconfig .npmrc)
          echo "Reusing runtime $VERSION."
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # `--i-mean-it-publish-publicly` is what gets past the script's own
      # refusal to send anything to npmjs. A name published there by accident
      # cannot be taken back, so the intent is stated rather than assumed.
      - name: Publish
        run: |
          ARGS="--i-mean-it-publish-publicly"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          # Said out loud rather than left to the script's default, so a push
          # to main can never move `latest` even if that default changes.
          if [ "${{ needs.plan.outputs.channel }}" = "dev" ]; then
            ARGS="$ARGS --tag dev"
          fi

          if [ "${{ needs.plan.outputs.build_runtimes }}" = "true" ]; then
            node scripts/publish.mjs $ARGS --packages dist-packages
          else
            node scripts/publish.mjs $ARGS \
              --only @vantail/shared,@vantail/api,@vantail/runtime,@vantail/vite,@vantail/cli,@vantail/create \
              --runtime-version "${{ steps.runtime.outputs.version }}"
          fi

      - name: Tidy up the registry config
        if: always()
        run: rm -f .npmrc

      - name: Attach the binaries to the GitHub release
        if: startsWith(github.ref, 'refs/tags/') && needs.plan.outputs.build_runtimes == 'true' 
        run: |
          cd dist-runtime
          for target in */; do
            tar -czf "../vantail-runtime-${target%/}.tar.gz" -C "$target" .
          done
          cd ..
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            vantail-runtime-*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
