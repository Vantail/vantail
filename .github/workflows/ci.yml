name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
    # Prose cannot fail any of this, and a macOS runner costs ten times a
    # Linux one.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast feedback, on the cheapest runner: the things that fail most often and
  # cost the least to check.
  lint:
    name: Lint
    # LINUX_RUNNER lets a self-hosted machine take this without editing the
    # workflow. Unset, it stays on a GitHub runner. Set it to a label your
    # runner actually advertises: a label nothing answers to does not fail,
    # it queues until it expires.
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The drift check compares against the last release tag, and a
          # shallow clone has no tags - it would pass by finding nothing.
          fetch-depth: 0

      - name: Install Linux webview dependencies
        run: |
          # A self-hosted runner is somebody's actual machine: install only
          # what is missing, and say so rather than reshaping it silently.
          if pkg-config --exists webkit2gtk-4.1 gtk+-3.0 2>/dev/null; then
            echo "webview libraries already present - nothing to install"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One version number lives in nine files; this is the only thing that
      # keeps them honest.
      - name: Check versions agree
        run: node scripts/version.mjs --check

      # And that it moved, if anything that ships did. The registry refuses to
      # publish over an existing version, so a forgotten bump is a release that
      # fails half way rather than one that quietly overwrites.
      - name: Check the version moved
        run: node scripts/version-drift.mjs

      - run: cargo fmt --all --check
      # `--all-features` because the release matrix publishes a sqlcipher
      # variant of every target, and `database-encryption` is not a default
      # feature. Without this, the code behind it is built and shipped
      # without ever being linted. The `features` job below only runs
      # `cargo check`, which compiles it but runs no lints.
      - run: cargo clippy --all-targets --all-features -- --deny warnings
      - run: pnpm build
      - run: pnpm --recursive run typecheck

  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    # Only the Linux entries follow LINUX_RUNNER; macOS and Windows need a
    # GitHub runner regardless.
    runs-on: ${{ startsWith(matrix.os, 'ubuntu') && (vars.LINUX_RUNNER || matrix.os) || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
        node: ["22.23.4"]
        include:
          # One extra job on the current LTS line, since that is what most
          # people will actually have installed. What it catches is
          # JavaScript-level and not platform-specific, so it runs on the
          # cheapest runner.
          - os: ubuntu-22.04
            node: "24.22.1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `--all-features` includes `database-encryption`, which builds OpenSSL
      # from source, and `openssl-src` shells out to Perl to configure it.
      # MSYS Perl cannot do that for an MSVC target, so say which Perl rather
      # than leaving it to PATH.
      - name: Perl for the vendored OpenSSL build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = "C:\Strawberry\perl\bin\perl.exe"
          if (-not (Test-Path $perl)) {
            choco install strawberryperl -y --no-progress
          }
          if (-not (Test-Path $perl)) {
            throw "No Strawberry Perl at $perl, and the vendored OpenSSL build needs one."
          }
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: cargo test --all-features
      - run: cargo build --release
      - run: pnpm build
      - run: pnpm run test:packages

      # These open real windows and drive a real webview, so they need a
      # desktop session. macOS and Windows runners have one.
      - name: Integration tests
        if: runner.os != 'Linux'
        run: pnpm run test:integration

      # The Linux runner has no desktop, so it gets the pieces of one the
      # suite needs - the same ones `scripts/linux/run` uses:
      #   - Xvfb, a display. Large enough for the window-size tests, and
      #     24-bit so screens report the depth a real one would.
      #   - openbox, a window manager. Maximising is something a window
      #     manager does; without one the window silently never changes size.
      #   - a D-Bus session, and GNOME Keyring in it as the Secret Service,
      #     unlocked with a throwaway password since nobody is there to type
      #     one. Without it the secrets test can only skip, and the keyring's
      #     whole Linux path (zbus) would go untested.
      - name: A virtual desktop for the integration tests
        if: runner.os == 'Linux'
        run: |
          # The runner image ships with package lists that can be days old,
          # and a stale index turns into a 404 from the mirror rather than a
          # version that resolves.
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb xauth dbus dbus-x11 openbox gnome-keyring

      - name: Integration tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        env:
          VANTAIL_FORCE_INTEGRATION: "1"
        run: |
          xvfb-run -a --server-args="-screen 0 1400x1000x24" dbus-run-session -- sh -c '
            printf throwaway | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            openbox >/dev/null 2>&1 &
            # Both come up in the background: the keyring claims its bus name
            # a moment after --unlock returns, and openbox takes a moment too.
            sleep 2
            pnpm run test:integration
          '

      # Packaging is where icon generation, bundling and the installer all
      # meet, and it is platform-specific - so it runs on every platform.
      - name: Package an example, with its installer
        working-directory: examples/react
        run: node ../../packages/cli/dist/bin.js package --installer

  # Proof that the capability features are genuinely optional, which is easy
  # to break by using an optional dependency from code that is not gated.
  features:
    name: Feature combinations
    # `cargo check` only: no window, no tests, so nothing here needs macOS.
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-22.04' }}
    env:
      # A gating mistake usually shows as a warning - an import only one
      # feature uses - and `cargo check` passes with warnings. Dead code is
      # allowed outside the default build (see `runtime/src/main.rs`), so
      # anything left is worth failing on. Dependencies are unaffected: cargo
      # caps their lints regardless.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux webview dependencies
        run: |
          # A self-hosted runner is somebody's actual machine: install only
          # what is missing, and say so rather than reshaping it silently.
          if pkg-config --exists webkit2gtk-4.1 gtk+-3.0 2>/dev/null; then
            echo "webview libraries already present - nothing to install"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --no-default-features
      - run: cargo check --no-default-features --features devtools
      - run: cargo check --no-default-features --features network
      - run: cargo check --no-default-features --features updater
      - run: cargo check --no-default-features --features secrets
      - run: cargo check --no-default-features --features mdns
      - run: cargo check --no-default-features --features hid
      - run: cargo check --no-default-features --features watch
      - run: cargo check --no-default-features --features socks
      - run: cargo check --no-default-features --features websocket
      - run: cargo check --no-default-features --features database
      - run: cargo check --no-default-features --features database-encryption
